# Activation patching: replace an activation with the one from another run.
#
# This is the HELD-OUT mechanism for the transfer test (Phase 9, hypothesis H4). A forecaster
# must never see activation-patch outcomes during training. It is a genuinely different
# operation from the additive family: it replaces the activation outright rather than moving
# it along a known direction, so a forecaster that has only learned a local linear response
# to a known vector has no reason to transfer.
#
# Keeping this file separate from the training mechanisms is deliberate. An experiment config
# that lists it under `intervention_refs` for training is a mistake, and
# `heldout_mechanisms` in the experiment config is what enforces the separation.
name: activation_patch
mechanism: activation_patch
mechanism_version: "1.0"
layers: [10, 13, 16]
positions: [-1]
strengths: [1.0]
