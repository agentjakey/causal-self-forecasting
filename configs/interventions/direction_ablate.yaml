# Projection ablation: h' = h - proj_v(h)
#
# Removes the component of the activation aligned with v. Defined only at strength 1.0:
# partial removal is a different operation and would need its own mechanism and its own
# controls.
#
# This mechanism answers a different question from residual addition. Addition asks whether
# pushing along v changes behavior; ablation asks whether the component the model already has
# along v is load-bearing.
name: direction_ablate
mechanism: direction_ablate
mechanism_version: "1.0"
layers: [10, 13, 16]
positions: [-1]
strengths: [1.0]
