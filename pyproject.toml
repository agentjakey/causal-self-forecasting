[project]
name = "causal-self-forecasting"
version = "0.0.1"
description = "CSF-Bench: testing whether language models can make precommitted, calibrated forecasts about how blinded internal interventions change their outputs."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.12,<3.13"
authors = [{ name = "Jacob Ortiz" }]
keywords = ["interpretability", "ai-safety", "causal-intervention", "benchmark"]

dependencies = [
    "pydantic>=2.9",
    "pyyaml>=6.0",
    "typer>=0.12",
    "rich>=13.7",
    "numpy>=1.26",
    "pandas>=2.2",
    "pyarrow>=17.0",
    "scikit-learn>=1.5",
    "matplotlib>=3.9",
    # `datasets` stays in the core dependency set, not the torch group, so that data
    # preparation runs on a machine with no torch installed.
    "datasets>=2.21",
]

[project.optional-dependencies]
# Kept separate so that schema, hashing, commitment, and CLI work can be developed and
# tested without pulling a multi-gigabyte torch wheel.
torch = [
    "torch>=2.4",
    "transformers>=4.44",
    "accelerate>=0.34",
    "peft>=0.12",
    "safetensors>=0.4",
]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "hypothesis>=6.112",
    "ruff>=0.6",
    "pyright>=1.1.380",
]

[project.scripts]
csf = "causal_self_forecasting.cli:app"

[project.urls]
Repository = "https://github.com/agentjakey/causal-self-forecasting"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/causal_self_forecasting"]

[tool.uv]
default-groups = []

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort
    "B",   # bugbear
    "UP",  # pyupgrade
    "SIM", # simplify
    "RUF", # ruff-specific
    "PTH", # use pathlib
    "A",   # builtin shadowing
]
ignore = [
    "B008", # Typer relies on function calls in argument defaults
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.12"
typeCheckingMode = "standard"
reportMissingImports = "warning"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
    "slow: requires real model weights or long compute",
    "torch: requires the torch optional dependency group",
]
