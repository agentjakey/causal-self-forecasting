# Smallest real-model intervention validation on Gemma 3 1B.
#
# This is harness validation, not a CSF-Bench scientific result. It exercises the intervention
# and resolution paths on real weights at one capture layer with a synthetic, unvalidated
# direction. No model organism, no estimated direction, no forecaster is involved, and any
# observations it produces are systems measurements.
#
# The direction is `gemma_synthetic`, a seeded random unit vector created by
# `csf directions synthetic`. It is not a bias direction and has passed no causal validation.
name: gemma_smoke
seed: 12345

model_ref: configs/models/gemma3_1b_it.yaml
task_ref: configs/tasks/arc_mcq.yaml
intervention_refs:
  - configs/interventions/gemma_smoke_residual_add.yaml

# Layer 13 is the middle of Gemma 3 1B's 26 blocks, the same layer the systems benchmark
# verified capture at.
capture_layers: [13]
capture_position: -1

direction_id: gemma_synthetic
random_control_count: 1
candidates_per_trial: 4
max_trials: 1

heldout_mechanisms:
  - activation_patch

trial_splits:
  - test

rerun_tolerance: 1.0e-3
