# Residual-stream addition: h' = h + alpha * v
#
# Layer indices follow the project convention: 0 is the embedding output, i is the output of
# decoder block i - 1. Layers here are middle layers of Gemma 3 1B (26 blocks).
#
# Strengths include 0.0, which must reproduce the clean run exactly. That is asserted by the
# zero-strength equality control, not assumed.
#
# Negative strengths are present so that sign reversal can be checked: if a direction is
# causally involved, positive and negative steering should move the margin coherently in
# opposite ways.
name: residual_add
mechanism: residual_add
mechanism_version: "1.0"
layers: [10, 13, 16]
positions: [-1]
strengths: [-4.0, -2.0, -1.0, 0.0, 1.0, 2.0, 4.0]
